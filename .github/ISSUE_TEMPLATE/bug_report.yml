name: Installation or runtime bug
description: Report a reproducible ICESEE-Spack problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials or private data. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe the failure and the concrete trigger.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Source and environment
      description: Parent branch/commit, subtree revision if relevant, OS or cluster, compiler, MPI, PETSc, Python, Firedrake/Icepack or ISSM versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and sanitized logs
      description: Exact commands, relevant configuration and exit codes. For MPI jobs include nodes, ranks, model_nprocs and ensemble size; omit private paths or data.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already performed
      description: Tests, whether outputs/checkpoints exist, and changes since the last working version.
